name: Software

on:
  pull_request:
    paths:
      - '.github/workflows/software*.yml'
      - 'sw/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/c4deszes/arm-gcc-docker:v1.4.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Install dependencies
        working-directory: sw
        run: python -m pip install --user -r tools/requirements.txt

      - name: GCC Problem Matcher
        uses: ammaraskar/gcc-problem-matcher@0.3.0

      - name: Build application
        working-directory: sw
        run: |
          cmake --workflow --preset workflow-build
